name: CI

on:
  push:
    branches: [ main, master, dev, feat/*, fix/* ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Install polyglot-framework-exporter (editable)
        run: |
          pip install -e .

      - name: Verify zero external runtime dependencies
        run: |
          python -c "import polyglot_framework_exporter; print('Successfully imported polyglot_framework_exporter with zero external dependencies!')"

      - name: Run test suite with pytest
        run: |
          pytest --cov=polyglot_framework_exporter --cov-report=term-missing -v

      - name: Test CLI entrypoints and commands
        run: |
          python -m polyglot_framework_exporter --help
          python -m polyglot_framework_exporter list
          polyglot-exporter --help
          polyglot-exporter list
          polyglot-exporter diagnostics
