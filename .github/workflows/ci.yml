name: CI

on:
  push:
    branches: [ main, master, dev, feat/*, fix/* ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Install polyglot-framework-exporter (editable)
        run: |
          pip install -e .

      - name: Verify zero external runtime dependencies
        run: |
          python -c "import polyglot_framework_exporter; print('Successfully imported polyglot_framework_exporter with zero external dependencies!')"

      - name: Run test suite with pytest
        run: |
          pytest --cov=polyglot_framework_exporter --cov-report=term-missing -v

      - name: Test CLI entrypoints and commands
        run: |
          python -m polyglot_framework_exporter --help
          python -m polyglot_framework_exporter list
          polyglot-exporter --help
          polyglot-exporter list
          polyglot-exporter diagnostics
